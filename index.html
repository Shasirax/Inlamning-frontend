<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inlämningsuppgit - Felix Brolleus</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Felix receptbok</h1>
      <nav class="main-menu-header">
        <a href="#" class="active">Hem</a>
        <a href="#">Recept</a>
        <a href="#">Inköpslista (antal)</a>
      </nav>
    </header>

    <main>
      <nav class="main-menu-mobile">
        <a href="#" class="active">Hem</a>
        <a href="#">Recept</a>
        <a href="#">Inköpslista (antal)</a>
      </nav>
      <div class="search">
        <input id="search-input" type="text" value="Sök recept..." />
        <button id="button-search-all">Alla</button>
        <button id="button-search-Middag">Middag</button>
        <button id="button-search-Bakning">Bakning</button>
      </div>

      <div class="recipe-cards">
        <article>
          <img src="" alt="Bild på första recept" />
          <h3>Recept 1</h3>
          <p>20 min * 4 portioner</p>
          <button>+ Lägg till i inköplista</button>
        </article>

        <article>
          <img src="" alt="Bild på första recept" />
          <h3>Recept 2</h3>
          <p>30 min * 2 portioner</p>
          <button>+ Lägg till i inköplista</button>
        </article>

        <article>
          <img src="" alt="Bild på första recept" />
          <h3>Recept 3</h3>
          <p>60 min * 4 portioner</p>
          <button>+ Lägg till i inköplista</button>
        </article>
      </div>
    </main>

    <aside>
      <h2>Inköpslista</h2>
      <ul>
        <li>Mjölk</li>
        <li>Ägg</li>
        <li>Mjöl</li>
      </ul>
      <button>Ladda ner .txt</button>
      <button>Töm listan</button>
    </aside>

    <footer>
      <h3>Privat receptsamling</h3>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
